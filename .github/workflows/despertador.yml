name: Despertador de Tito

# Mantiene despierta la instancia gratis de Render pingueando /api/health.
# Render duerme el servicio tras ~15 min sin tráfico; esto le pega cada 10 min
# en horario de mercado (lun-vie, ~08:00-18:00 ET → 12:00-22:00 UTC) para que
# esté listo al instante cuando lo abras en el celular.
#
# REQUISITO: define la variable de repo TITO_URL con la URL de Render
# (Settings → Secrets and variables → Actions → Variables → New: TITO_URL =
# https://tito-metralleta.onrender.com). Sin ella, el job no hace nada.
#
# OJO: los workflows programados solo corren desde la rama por defecto (main),
# así que este archivo debe estar en main para que el cron dispare.

on:
  schedule:
    - cron: "*/10 12-22 * * 1-5"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar a Tito
        run: |
          if [ -z "${{ vars.TITO_URL }}" ]; then
            echo "Falta la variable de repo TITO_URL — nada que pinguear."
            exit 0
          fi
          echo "Pingueando ${{ vars.TITO_URL }}/api/health ..."
          curl -fsS --max-time 60 "${{ vars.TITO_URL }}/api/health" && echo "" && echo "✅ Tito despierto"
